title: LogiSheets
homeUrl: https://www.logisheets.com
demoUrl: https://www.logisheets.com
githubRepo: logisky/LogiSheets
npmPackage: logisheets-engine
license: MIT License
revenueModel: Free
description: >
  An out-of-the-box web spreadsheet component with a Rust and WebAssembly
  engine that reads and writes real .xlsx files, preserving formulas and
  styles, in the browser or Node.js. It renders in a Web Worker and ships with
  multi-sheet tabs, live formulas, find, and CSV export.
frameworks:
  vanilla: true
  svelte: true
features:
  accessible: false
  copyPaste: false
  csvExport: true
  customEditors: true
  customFormatters: true
  draggableRows: false
  editable: true
  fillDown: false
  fillRight: false
  filtering: true
  formulas: true
  freezableCols: false
  headless: false
  i18n: false
  maintained: true
  mergeCells: true
  openSource: true
  pagination: false
  pdfExport: false
  pivots: false
  rangeSelection: true
  resizableCols: true
  responsive: false
  rowGrouping: false
  rowPinning: false
  rowSelection: true
  search: true
  serverSide: false
  sorting: true
  sparklines: false
  theming: false
  trees: false
  typescript: true
  xlsxExport: true
  virtualization: true
